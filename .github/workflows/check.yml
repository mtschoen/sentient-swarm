name: Check

on:
  push:
  pull_request:

# Untrusted pull request code runs here with a read-only token and no persisted credentials.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run coverage
      - run: npm run build

  gpu-software:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Required since its first green hosted run (2026-11-08). A "no adapter" outcome makes
    # check:gpu exit 2, so it shows as a failed step, never a pass.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - run: npx playwright install --with-deps chromium
      - name: GPU page checks on the software adapter
        env:
          WEBGPU_ADAPTER: fallback
        run: npm run check:gpu
